<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <title>BarberHub — menu público mobile aberto</title>
  <desc>Estado aberto do PublicMobileMenu com drawer de 85 por cento da largura.</desc>
  <defs>
    <style>
      .font { font-family: Geist, Inter, Arial, sans-serif; }
      .nav { font-family: Geist, Inter, Arial, sans-serif; font-size: 16px; font-weight: 500; }
      .button { font-family: Geist, Inter, Arial, sans-serif; font-size: 16px; font-weight: 650; }
    </style>
  </defs>

  <g id="page-behind" data-name="Página ao fundo">
    <rect width="390" height="844" fill="#07111C"/>
    <text x="24" y="132" class="font" font-size="34" font-weight="700" fill="white">Organize sua</text>
    <text x="24" y="174" class="font" font-size="34" font-weight="700" fill="white">barbearia.</text>
    <rect x="24" y="224" width="342" height="52" rx="10" fill="#0EA5E9"/>
  </g>

  <g id="backdrop" data-name="Backdrop escuro">
    <rect width="390" height="844" fill="black" fill-opacity="0.50"/>
  </g>

  <g id="public-navigation" data-name="Drawer — 85% da largura, máximo 384px">
    <rect width="332" height="844" fill="#0D1722"/>

    <g id="drawer-header" data-name="Cabeçalho do drawer">
      <text x="16" y="44" class="font" font-size="24" font-weight="700" letter-spacing="1.2" fill="white">BARBER<tspan fill="#0EA5E9">HUB</tspan></text>
      <g id="drawer-close-button" data-name="Fechar menu — área 44x44">
        <rect x="280" y="8" width="44" height="44" rx="8" fill="#0D1722"/>
        <path d="M294 22L310 38M310 22L294 38" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <g id="drawer-navigation" data-name="Navegação principal" class="nav" fill="white">
      <g id="drawer-link-inicio" data-name="Início — área 48px"><rect x="8" y="76" width="316" height="48" rx="8" fill="#0D1722"/><text x="16" y="106">Início</text></g>
      <g id="drawer-link-produto" data-name="Produto — área 48px"><rect x="8" y="124" width="316" height="48" rx="8" fill="#0D1722"/><text x="16" y="154">Produto</text></g>
      <g id="drawer-link-servicos" data-name="Serviços — área 48px"><rect x="8" y="172" width="316" height="48" rx="8" fill="#0D1722"/><text x="16" y="202">Serviços</text></g>
      <g id="drawer-link-planos" data-name="Planos — área 48px"><rect x="8" y="220" width="316" height="48" rx="8" fill="#0D1722"/><text x="16" y="250">Planos</text></g>
      <g id="drawer-link-contato" data-name="Contato — área 48px"><rect x="8" y="268" width="316" height="48" rx="8" fill="#0D1722"/><text x="16" y="298">Contato</text></g>
    </g>

    <g id="drawer-auth-actions" data-name="Ações de autenticação">
      <line x1="16" y1="682.5" x2="316" y2="682.5" stroke="#475569"/>
      <rect x="16" y="707" width="300" height="48" rx="6" fill="#0EA5E9"/>
      <text x="166" y="737" text-anchor="middle" class="button" fill="white">Entrar</text>
      <rect x="16" y="767" width="300" height="48" rx="6" fill="#0EA5E9"/>
      <text x="166" y="797" text-anchor="middle" class="button" fill="white">Registrar</text>
    </g>
  </g>
</svg>
